[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "adora-api"
version = "1.0.0"
description = "ADORA modular-monolith FastAPI service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.119,<1",
  "geoalchemy2>=0.18,<1",
  "google-genai>=1.46,<2",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=6.4,<7",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic", "requirements.lock"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["geoalchemy2.*"]
ignore_missing_imports = true
